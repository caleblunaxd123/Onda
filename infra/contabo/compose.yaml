name: onda
services:
  api:
    image: ${ONDA_IMAGE:?Set ONDA_IMAGE}
    container_name: onda-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      AllowedHosts: "onda-api.lunalav.pe;onda.lunalav.pe"
      PublicAssetsPath: /app/public
      Cors__Origins__0: https://onda.lunalav.pe
      ConnectionStringFile: /run/secrets/connection
      ReverseProxy__KnownProxies__0: 10.77.0.10
      Catalog__Mode: auto
    secrets:
      - source: runtime_connection
        target: connection
    networks: [data, web]
    volumes: ["./public:/app/public:ro"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  data: {external: true, name: stack_data}
  web: {external: true, name: stack_web}
secrets:
  runtime_connection: {file: ./secrets/runtime.connection}
