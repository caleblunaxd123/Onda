name: onda
services:
  migrate:
    image: ${ONDA_IMAGE:?Set ONDA_IMAGE}
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStringFile: /run/secrets/connection
      Catalog__SyncEnabled: "false"
    secrets:
      - source: migration_connection
        target: connection
    networks: [data]
    restart: "no"
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    image: ${ONDA_IMAGE:?Set ONDA_IMAGE}
    container_name: onda-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      AllowedHosts: "onda-api.lunalav.pe;onda.lunalav.pe"
      PublicAssetsPath: /app/public
      Cors__Origins__0: https://onda.lunalav.pe
      Cors__Origins__1: https://onda-api.lunalav.pe
      ConnectionStringFile: /run/secrets/connection
      ReverseProxy__KnownProxies__0: 10.77.0.10
      Catalog__Mode: auto
      Assistant__OllamaUrl: http://ollama:11434
      Assistant__Model: qwen2.5:1.5b
    secrets:
      - source: runtime_connection
        target: connection
    networks: [data, web, ai]
    volumes: ["./public:/app/public:ro"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    logging: *logging
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: onda-ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes: ["models:/root/.ollama"]
    networks: [ai]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    logging: *logging
networks:
  ai: {}
  data: {external: true, name: stack_data}
  web: {external: true, name: stack_web}
volumes:
  models: {}
secrets:
  runtime_connection: {file: ./secrets/runtime.connection}
  migration_connection: {file: ./secrets/migration.connection}
